<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
<title>מוצר | געגע בקרקס המשוגע</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="duck">🦆</span> געגע בקרקס המשוגע</a>
    <button class="nav-toggle" aria-label="פתח תפריט">☰</button>
    <nav class="main-nav">
      <a href="index.html">בית</a>
      <a href="about.html">אודות</a>
      <a href="store.html" aria-current="page">חנות</a>
      <a href="events.html">הופעות וימי הולדת</a>
      <a href="raffle.html">הגרלות</a>
    </nav>
  </div>
</header>

<section>
  <div class="container" id="product-wrap" style="padding-top:40px;">
    <div class="empty-state">טוען מוצר...</div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="brand" style="color:var(--cream);">🦆 געגע בקרקס המשוגע</div>
    <p><a href="store.html">חזרה לחנות</a></p>
  </div>
</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get("slug");
const wrap = document.getElementById("product-wrap");

async function loadProduct() {
  if (!slug) { wrap.innerHTML = `<div class="empty-state">לא צוין מוצר.</div>`; return; }

  const { data: product, error } = await supabaseClient
    .from("products").select("*").eq("slug", slug).single();

  if (error || !product) {
    wrap.innerHTML = `<div class="empty-state">המוצר לא נמצא.</div>`;
    return;
  }

  wrap.innerHTML = `
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:40px; align-items:start;" class="product-layout">
      <div class="card" style="margin:0;">
        <div class="card-media"><img src="${product.image_url || ''}" alt="${product.name}"></div>
      </div>
      <div>
        <span class="eyebrow-badge">חנות געגע</span>
        <h1>${product.name}</h1>
        <p>${product.description}</p>
        <p class="price-tag" style="font-size:1.6rem;">₪${product.price}</p>

        <form id="order-form">
          <input type="hidden" name="product_id" value="${product.id}">
          <input type="hidden" name="product_name" value="${product.name}">
          <div class="field">
            <label for="buyer_name">שם מלא</label>
            <input type="text" id="buyer_name" name="buyer_name" required>
          </div>
          <div class="field">
            <label for="phone">טלפון</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
          <div class="field">
            <label for="email">אימייל</label>
            <input type="email" id="email" name="email">
          </div>
          <div class="field">
            <label for="address">כתובת למשלוח</label>
            <input type="text" id="address" name="address">
          </div>
          <div class="field">
            <label for="notes">הערות</label>
            <textarea id="notes" name="notes"></textarea>
          </div>
          <p class="form-note">זהו אתר הדגמה - לא מתבצעת כאן סליקת תשלום אמיתית. הפרטים נשמרים לצורך המשך טיפול בהזמנה.</p>
          <button type="submit" class="btn btn-primary btn-block">אשרו הזמנה</button>
          <div class="form-message" id="order-msg"></div>
        </form>
      </div>
    </div>
    <style>@media (max-width:760px){.product-layout{grid-template-columns:1fr !important;}}</style>
  `;

  document.getElementById("order-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector("button[type=submit]");
    const msg = document.getElementById("order-msg");
    btn.disabled = true;

    const { error } = await supabaseClient.from("orders").insert({
      product_id: form.product_id.value,
      product_name: form.product_name.value,
      buyer_name: form.buyer_name.value,
      phone: form.phone.value,
      email: form.email.value,
      address: form.address.value,
      notes: form.notes.value
    });

    if (error) {
      showFormMessage(msg, "error", "משהו השתבש, נסו שוב.");
      console.error(error);
      btn.disabled = false;
      return;
    }
    showFormMessage(msg, "success", "ההזמנה נשמרה בהצלחה! ניצור איתכם קשר בקרוב.");
    confettiBurst();
    form.reset();
    btn.disabled = false;
  });
}
loadProduct();
</script>
</body>
</html>
